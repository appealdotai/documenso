name: Staging Schedule

on:
  schedule:
    - cron: '0 1 * * 1-5' # 9:00 AM GMT+8 Mon–Fri → START
    - cron: '0 10 * * 1-5' # 6:00 PM GMT+8 Mon–Fri → STOP
  workflow_dispatch:
    inputs:
      action:
        description: Start or stop staging
        required: true
        type: choice
        options:
          - start
          - stop

jobs:
  toggle-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Start staging (9:00 AM GMT+8)
        if: >-
          github.event.schedule == '0 1 * * 1-5' ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'start')
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          STAGING_ENV_ID: ${{ secrets.STAGING_ENV_ID }}
          STAGING_SERVICE_ID: ${{ secrets.STAGING_SERVICE_ID }}
        run: |
          curl --fail-with-body -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer ${RAILWAY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg environmentId "$STAGING_ENV_ID" \
              --arg serviceId "$STAGING_SERVICE_ID" \
              --argjson numReplicas 1 \
              '{
                query: "mutation($environmentId: String!, $serviceId: String!, $numReplicas: Int!) { serviceInstanceUpdate(environmentId: $environmentId, serviceId: $serviceId, input: { numReplicas: $numReplicas }) }",
                variables: {
                  environmentId: $environmentId,
                  serviceId: $serviceId,
                  numReplicas: $numReplicas
                }
              }')"

      - name: Stop staging (6:00 PM GMT+8)
        if: >-
          github.event.schedule == '0 10 * * 1-5' ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'stop')
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          STAGING_ENV_ID: ${{ secrets.STAGING_ENV_ID }}
          STAGING_SERVICE_ID: ${{ secrets.STAGING_SERVICE_ID }}
        run: |
          curl --fail-with-body -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer ${RAILWAY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg environmentId "$STAGING_ENV_ID" \
              --arg serviceId "$STAGING_SERVICE_ID" \
              --argjson numReplicas 0 \
              '{
                query: "mutation($environmentId: String!, $serviceId: String!, $numReplicas: Int!) { serviceInstanceUpdate(environmentId: $environmentId, serviceId: $serviceId, input: { numReplicas: $numReplicas }) }",
                variables: {
                  environmentId: $environmentId,
                  serviceId: $serviceId,
                  numReplicas: $numReplicas
                }
              }')"
